name: Github Metrics
on:
  schedule: [{cron: "0 16 * * *"}]
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Left Side
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-left.svg
          token: ${{ secrets.TOKEN }}
          base: header
          base_indepth: yes
          output_action: gist
          committer_gist: ${{ secrets.GIST }}
          config_order: base.header, isocalendar, languages, notable, discussions, topics
          
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot, scala
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 2
          plugin_notable: yes
          plugin_discussions: yes
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

      - name: Right Side
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-right.svg
          token: ${{ secrets.TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.GIST }}
          config_order: achievements, leetcode, sponsors, fortune, music
          
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_sponsors: yes
          plugin_sponsors_past: yes
          plugin_fortune: yes
          plugin_leetcode: yes
          plugin_leetcode_sections: solved, skills, recent
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}
          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_user: LordRiyan
